add_newline = false
command_timeout = 2000

format = "$directory$git_branch$git_status$nodejs$python$rust$golang$docker_context$cmd_duration$line_break$character"

[directory]
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
format = "[$all_status$ahead_behind]($style) "

[nodejs]
symbol = " "

[python]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"



